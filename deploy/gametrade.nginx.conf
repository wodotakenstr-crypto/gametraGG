server {
    listen 80;
    listen [::]:80;
    server_name gametradegg.com www.gametradegg.com;
    return 301 https://gametradegg.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gametradegg.com www.gametradegg.com;

    ssl_certificate /etc/letsencrypt/live/gametradegg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gametradegg.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
