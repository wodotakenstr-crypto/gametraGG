<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Configurar correo | GameTrade</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="smtp-setup.css" /></head>
  <body><main><a class="brand" href="index.html"><span>G</span>GameTrade</a><section><p>CONFIGURACIÓN LOCAL</p><h1>Conectar Brevo</h1><span>Esta pantalla solo funciona en este equipo. La clave no se guarda en archivos.</span><form id="smtpForm"><label>Servidor SMTP<input name="host" value="smtp-relay.sendinblue.com" required /></label><label>Puerto<select name="port"><option value="2525">2525 (STARTTLS alternativo)</option><option value="465">465 (SSL/TLS)</option><option value="587">587 (STARTTLS)</option></select></label><label>Seguridad<select name="secure"><option value="false">STARTTLS</option><option value="true">SSL/TLS</option></select></label><label>Usuario SMTP de Brevo<input name="user" required placeholder="Valor Login de Brevo" /></label><label>Clave SMTP<input name="password" type="password" required /></label><label>Correo remitente verificado<input name="fromEmail" type="email" required /></label><button type="submit">Probar y conectar Brevo</button><div id="status" aria-live="polite"></div></form></section></main><script src="smtp-setup.js"></script></body>
</html>
